<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | Telemedicine++</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand">Telemedicine<span class="plus">++</span></a>
    <nav class="nav-links"></nav>
    <div class="nav-cta desktop-only">
      <a href="signup.html" class="btn btn-ghost-onink btn-sm">Sign Up</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to continue to your dashboard.</p>

    <form id="login-form">
      <div class="error-msg"></div>

      <label style="font-size:.82rem; font-weight:600; color:var(--ink); display:block; margin-bottom:8px;">I am a...</label>
      <div class="role-toggle">
        <input type="radio" name="role" id="role-patient" value="patient" checked>
        <label for="role-patient">Patient</label>
        <input type="radio" name="role" id="role-doctor" value="doctor">
        <label for="role-doctor">Doctor</label>
        <input type="radio" name="role" id="role-sitter" value="sitter">
        <label for="role-sitter">Sitter</label>
      </div>

      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-coral btn-block">Log In</button>
    </form>

    <p class="auth-foot">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
